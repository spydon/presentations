name: common
description: "Widgets, theme and configuration shared by the presentations."
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.14.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_deck: ^0.29.0
  syntax_highlight: ^0.5.0

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  # Outfit by Rodrigo Fuenzalida, SIL Open Font License (assets/fonts/Outfit-OFL.txt).
  # Use it through Brand.fontFamily.
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Variable.ttf
