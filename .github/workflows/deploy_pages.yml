name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - run: dart pub global activate melos
      - run: melos bootstrap
      - run: melos format --output none --set-exit-if-changed
      - run: melos analyze
      - run: melos test
      - run: melos run build_web --no-select

      # Every presentation is served from
      # https://spydon.github.io/presentations/<directory>/.
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html favicon.svg favicon.png _site/
          for web in */build/web; do
            cp -r "$web" "_site/${web%%/*}"
          done

      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
