name: presentations_workspace
publish_to: none

environment:
  sdk: ^3.14.0

workspace:
  - common
  - supabase_flutter_v3
  - supabase_py_v3

dev_dependencies:
  melos: ^8.10.1

melos:
  ide:
    intellij:
      enabled: false

  scripts:
    build_web:
      description: Build every presentation for the web, served from /<directory>/.
      exec:
        command: flutter build web --release --base-href "/\$(basename $MELOS_PACKAGE_PATH)/"
        failFast: true
      packageFilters:
        dirExists: web

    icons:
      description: Render tool/icon into the favicon of the landing page and the icons of every presentation.
      run: tool/icon/render.sh
